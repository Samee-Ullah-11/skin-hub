<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbeee6"/><stop offset="1" stop-color="#e8f0f8"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <circle cx="1250" cy="120" r="220" fill="#f0b9a0" opacity="0.45" filter="url(#blur)"/>
  <circle cx="260" cy="560" r="260" fill="#a9c8e4" opacity="0.5" filter="url(#blur)"/>
  <circle cx="820" cy="80" r="160" fill="#c7dcb1" opacity="0.4" filter="url(#blur)"/>
  <!-- arched windows -->
  <path d="M980 700 V330 a150 150 0 0 1 300 0 V700 Z" fill="url(#arch)"/>
  <path d="M1310 700 V400 a110 110 0 0 1 220 0 V700 Z" fill="url(#arch)" opacity="0.7"/>
  <path d="M1130 700 V340" stroke="#f0b9a0" stroke-width="4" opacity="0.6"/>
  <path d="M980 470 H1280" stroke="#f0b9a0" stroke-width="4" opacity="0.6"/>
  <!-- treatment chair -->
  <g opacity="0.85">
    <rect x="690" y="520" width="300" height="46" rx="23" fill="#f0b9a0"/>
    <rect x="930" y="430" width="70" height="120" rx="30" fill="#f0b9a0"/>
    <rect x="735" y="566" width="18" height="90" rx="9" fill="#9a4d36" opacity="0.35"/>
    <rect x="925" y="566" width="18" height="90" rx="9" fill="#9a4d36" opacity="0.35"/>
  </g>
  <!-- plant -->
  <g>
    <rect x="530" y="560" width="90" height="100" rx="18" fill="#a9c8e4"/>
    <path d="M575 560 C540 470 470 440 440 380 C520 400 570 460 575 560 Z" fill="#c7dcb1"/>
    <path d="M575 560 C600 460 660 420 700 360 C690 450 630 510 575 560 Z" fill="#c7dcb1" opacity="0.85"/>
    <path d="M575 560 C570 470 585 400 575 320 C620 400 610 480 575 560 Z" fill="#c7dcb1" opacity="0.7"/>
  </g>
  <!-- shelf with jars -->
  <rect x="1360" y="520" width="200" height="10" rx="5" fill="#9a4d36" opacity="0.25"/>
  <rect x="1380" y="470" width="34" height="50" rx="8" fill="#a9c8e4"/>
  <rect x="1425" y="455" width="30" height="65" rx="8" fill="#c7dcb1"/>
  <rect x="1466" y="480" width="40" height="40" rx="10" fill="#f0b9a0"/>
  <!-- floor line -->
  <rect x="0" y="655" width="1600" height="45" fill="#ffffff" opacity="0.35"/>
</svg>
